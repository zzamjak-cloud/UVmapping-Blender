name: Blender Extension 초안 릴리스

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BLENDER_VERSION: "4.5.13"
      BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
      BLENDER_CHECKSUM: blender-4.5.13.sha256
      BLENDER_DOWNLOAD_ROOT: https://download.blender.org/release/Blender4.5
      BLENDER_CACHE_DIR: /home/runner/.cache/blender

    steps:
      - name: 태그 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 태그와 매니페스트 버전 대조
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("blender_manifest.toml").open("rb") as manifest_file:
              print(tomllib.load(manifest_file)["version"])
          PY
          )"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "릴리스 워크플로우는 태그에서만 실행할 수 있습니다." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${manifest_version}" ]]; then
            echo "태그(${GITHUB_REF_NAME})와 매니페스트 버전(${manifest_version})이 다릅니다." >&2
            exit 1
          fi
          echo "MANIFEST_VERSION=${manifest_version}" >> "${GITHUB_ENV}"
          echo "ASSET_NAME=uvmapping_blender-v${manifest_version}.zip" >> "${GITHUB_ENV}"

      - name: Python 정적 검사와 전체 순수 회귀
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_project.py
          for test_file in tests/test_*_pure.py; do
            python3 "${test_file}"
          done

      - name: Blender 다운로드 캐시 복원
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BLENDER_CACHE_DIR }}
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}-linux-x64

      - name: 공식 Blender 다운로드 및 SHA-256 검증
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BLENDER_CACHE_DIR}"
          checksum_file="${BLENDER_CACHE_DIR}/${BLENDER_CHECKSUM}"
          archive_path="${BLENDER_CACHE_DIR}/${BLENDER_ARCHIVE}"

          curl --fail --location --silent --show-error \
            "${BLENDER_DOWNLOAD_ROOT}/${BLENDER_CHECKSUM}" \
            --output "${checksum_file}"
          if [[ ! -f "${archive_path}" ]]; then
            curl --fail --location --silent --show-error \
              "${BLENDER_DOWNLOAD_ROOT}/${BLENDER_ARCHIVE}" \
              --output "${archive_path}"
          fi

          mapfile -t checksum_matches < <(
            awk -v name="${BLENDER_ARCHIVE}" '$2 == name { print $1 }' "${checksum_file}"
          )
          if (( ${#checksum_matches[@]} != 1 )); then
            echo "공식 체크섬 파일의 ${BLENDER_ARCHIVE} 항목은 정확히 하나여야 합니다." >&2
            exit 1
          fi
          expected_checksum="${checksum_matches[0]}"
          if [[ ! "${expected_checksum}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "공식 체크섬 형식이 올바르지 않습니다: ${BLENDER_ARCHIVE}" >&2
            exit 1
          fi
          printf '%s  %s\n' "${expected_checksum}" "${archive_path}" | sha256sum -c -

      - name: Blender 압축 해제
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/blender-${BLENDER_VERSION}"
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"
          tar -xJf "${BLENDER_CACHE_DIR}/${BLENDER_ARCHIVE}" \
            --strip-components=1 \
            -C "${install_dir}"
          test -x "${install_dir}/blender"
          echo "BLENDER_BIN=${install_dir}/blender" >> "${GITHUB_ENV}"

      - name: 격리 Blender 프로필 준비
        shell: bash
        run: |
          set -euo pipefail
          profile_root="${RUNNER_TEMP}/uvmapping-blender-release"
          extension_root="${profile_root}/extensions/user_default"
          mkdir -p "${extension_root}"
          ln -s "${GITHUB_WORKSPACE}" "${extension_root}/uvmapping_blender"
          echo "BLENDER_USER_RESOURCES=${profile_root}" >> "${GITHUB_ENV}"
          echo "UVMAPPING_PROFILE_ROOT=${profile_root}" >> "${GITHUB_ENV}"
          echo "UVMAPPING_REPOSITORY_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "UVMAPPING_ADDON_ID=uvmapping_blender" >> "${GITHUB_ENV}"

      - name: Blender Extension 활성화
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_BIN}" --background --python-exit-code 1 \
            --python scripts/dev_bootstrap.py

      - name: Blender 통합 회귀
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/blender_smoke.py \
            tests/blender_v1.py \
            tests/blender_quality.py \
            tests/blender_texture.py
          do
            "${BLENDER_BIN}" --background --python-exit-code 1 \
              --python "${test_file}"
          done

      - name: Extension 소스 빌드 및 공식 검증
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/release-package"
          package_path="${package_dir}/${ASSET_NAME}"
          mkdir -p "${package_dir}"
          "${BLENDER_BIN}" --factory-startup --command extension validate .
          "${BLENDER_BIN}" --factory-startup --command extension build \
            --source-dir . \
            --output-filepath "${package_path}"
          mapfile -t packages < <(find "${package_dir}" -maxdepth 1 -type f -name '*.zip' -print)
          if (( ${#packages[@]} != 1 )) || [[ "${packages[0]}" != "${package_path}" ]]; then
            echo "릴리스 ZIP은 ${ASSET_NAME} 하나만 생성되어야 합니다." >&2
            exit 1
          fi
          "${BLENDER_BIN}" --factory-startup --command extension validate "${package_path}"

      - name: 검증된 ZIP 전달
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 태그 메타데이터 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 검증된 ZIP 내려받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package

      - name: 초안 Release와 자산 생성
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("blender_manifest.toml").open("rb") as manifest_file:
              print(tomllib.load(manifest_file)["version"])
          PY
          )"
          asset_name="uvmapping_blender-v${manifest_version}.zip"
          package_path="${RUNNER_TEMP}/release-package/${asset_name}"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"
          test -f "${package_path}"

          if gh release view "${GITHUB_REF_NAME}" --json isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "이미 공개된 Release는 이 워크플로우에서 수정하지 않습니다." >&2
              exit 1
            fi
            gh release upload "${GITHUB_REF_NAME}" "${package_path}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${package_path}" \
              --verify-tag \
              --draft \
              --title "UVmapping Blender ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

          is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
          test "${is_draft}" = "true"
          mapfile -t zip_assets < <(
            gh release view "${GITHUB_REF_NAME}" --json assets \
              --jq '.assets[].name | select(endswith(".zip"))'
          )
          if (( ${#zip_assets[@]} != 1 )) || [[ "${zip_assets[0]}" != "${asset_name}" ]]; then
            echo "초안 Release에는 ${asset_name} ZIP 하나만 있어야 합니다." >&2
            exit 1
          fi

          package_size="$(stat -c '%s' "${package_path}")"
          package_sha256="$(sha256sum "${package_path}" | awk '{print $1}')"
          target_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          {
            echo "## 초안 Release 생성 완료"
            echo
            echo "이 단계는 공개하지 않습니다. 다음 값을 distribution/releases.lock.json에 반영하고 기본 브랜치에 push한 뒤 초안을 공개하세요."
            echo
            echo "- tag: ${GITHUB_REF_NAME}"
            echo "- asset: ${asset_name}"
            echo "- size: ${package_size}"
            echo "- sha256: ${package_sha256}"
            echo "- target_commit: ${target_commit}"
          } >> "${GITHUB_STEP_SUMMARY}"
