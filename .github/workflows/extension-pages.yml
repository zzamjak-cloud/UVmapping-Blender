name: Blender Extension Pages 배포

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 신뢰할 수 없는 포크 PR의 코드나 아티팩트는 이 배포 경로에서 실행하지 않습니다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BLENDER_VERSION: "4.5.13"
      BLENDER_ARCHIVE: blender-4.5.13-linux-x64.tar.xz
      BLENDER_CHECKSUM: blender-4.5.13.sha256
      BLENDER_DOWNLOAD_ROOT: https://download.blender.org/release/Blender4.5
      BLENDER_CACHE_DIR: /home/runner/.cache/blender

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release 이벤트의 태그가 아니라, 새 잠금 파일이 먼저 반영된 기본 브랜치를 사용합니다.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Blender 다운로드 캐시 복원
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BLENDER_CACHE_DIR }}
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}-linux-x64

      - name: 공식 Blender 다운로드 및 SHA-256 검증
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BLENDER_CACHE_DIR}"
          checksum_file="${BLENDER_CACHE_DIR}/${BLENDER_CHECKSUM}"
          archive_path="${BLENDER_CACHE_DIR}/${BLENDER_ARCHIVE}"

          curl --fail --location --silent --show-error \
            "${BLENDER_DOWNLOAD_ROOT}/${BLENDER_CHECKSUM}" \
            --output "${checksum_file}"
          if [[ ! -f "${archive_path}" ]]; then
            curl --fail --location --silent --show-error \
              "${BLENDER_DOWNLOAD_ROOT}/${BLENDER_ARCHIVE}" \
              --output "${archive_path}"
          fi

          mapfile -t checksum_matches < <(
            awk -v name="${BLENDER_ARCHIVE}" '$2 == name { print $1 }' "${checksum_file}"
          )
          if (( ${#checksum_matches[@]} != 1 )); then
            echo "공식 체크섬 파일의 ${BLENDER_ARCHIVE} 항목은 정확히 하나여야 합니다." >&2
            exit 1
          fi
          expected_checksum="${checksum_matches[0]}"
          if [[ ! "${expected_checksum}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "공식 체크섬 형식이 올바르지 않습니다: ${BLENDER_ARCHIVE}" >&2
            exit 1
          fi
          printf '%s  %s\n' "${expected_checksum}" "${archive_path}" | sha256sum -c -

      - name: Blender 압축 해제
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/blender-${BLENDER_VERSION}"
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"
          tar -xJf "${BLENDER_CACHE_DIR}/${BLENDER_ARCHIVE}" \
            --strip-components=1 \
            -C "${install_dir}"
          test -x "${install_dir}/blender"
          echo "BLENDER_BIN=${install_dir}/blender" >> "${GITHUB_ENV}"

      - name: 공개 Release와 잠금 파일 대조
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases_json="${RUNNER_TEMP}/stable-releases.json"
          release_plan="${RUNNER_TEMP}/release-plan.tsv"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${releases_json}"
          python3 scripts/check_extension_repository.py releases \
            distribution/releases.lock.json \
            "${releases_json}" \
            > "${release_plan}"
          test -s "${release_plan}"
          echo "RELEASE_PLAN=${release_plan}" >> "${GITHUB_ENV}"

      - name: 잠긴 Release 패키지 다운로드 및 검증
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public
          while IFS=$'\t' read -r asset_id tag version asset_name size sha256 url target_commit; do
            test -n "${asset_id}"
            resolved_commit="$(git rev-parse "${tag}^{commit}")"
            if [[ "${resolved_commit}" != "${target_commit}" ]]; then
              echo "${tag}의 대상 커밋이 잠금 파일과 다릅니다." >&2
              exit 1
            fi

            destination="public/${asset_name}"
            test ! -e "${destination}"
            gh api \
              -H "Accept: application/octet-stream" \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "${destination}"
            actual_size="$(stat -c '%s' "${destination}")"
            if [[ "${actual_size}" != "${size}" ]]; then
              echo "${asset_name}의 실제 크기가 잠금 값과 다릅니다." >&2
              exit 1
            fi
            printf '%s  %s\n' "${sha256}" "${destination}" | sha256sum -c -
            "${BLENDER_BIN}" --command extension validate "${destination}"
            echo "검증 완료: ${tag} (${version}, ${url})"
          done < "${RELEASE_PLAN}"

      - name: Blender Extension 저장소 생성
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_BIN}" --command extension server-generate \
            --repo-dir=public \
            --html

      - name: Extension 저장소 무결성 검사
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_extension_repository.py repository \
            public \
            distribution/releases.lock.json

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 구성
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
